<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EdgeSecurity</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body data-page="dashboard"><template id="page-template">
<div class="page-head"><div><h1>Dashboard</h1><p>Visão geral do ambiente de monitoramento</p></div></div>
<div id="dashboard-stats" class="stat-grid"></div>
<div class="dashboard-grid">
  <section class="card camera-card">
    <div class="card-head"><div><h2>Câmeras</h2><p id="camera-location">Nenhuma câmera cadastrada</p></div><span class="live" style="display:none">● AO VIVO</span></div>
    <div class="camera-stage"><div class="camera-placeholder"><div class="camera-icon">◉</div><strong id="camera-name">Nenhuma câmera cadastrada</strong><span id="camera-status">Adicione uma câmera para iniciar o monitoramento</span><button class="btn btn-primary" id="dashboard-camera-btn">Abrir câmeras</button></div></div>
  </section>
  <section class="card"><div class="card-head"><div><h2>Alertas recentes</h2><p>Eventos registrados pelo sistema</p></div><a class="link" href="alertas.html">Ver todos</a></div><div id="recent-alerts" class="list"></div></section>
</div>
<div class="card activity-preview"><div class="card-head"><div><h2>Atividade recente</h2><p>Últimas ações registradas</p></div><a class="link" href="atividades.html">Monitorar atividades</a></div><div id="recent-activities" class="table-wrap"></div></div>
</template><div id="app"></div>
<script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script src="../js/dashboard.js"></script></body></html>
