<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios — EdgeSecurity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/relatorios.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body data-page="relatorios">
    <template id="page-template">
      <div class="page-head">
        <div>
          <h1>Relatórios</h1>
          <p>Resumo de uso, alertas e tempo online — filtre por período</p>
        </div>
        <button class="btn btn-primary" id="export-report">
          Exportar relatório
        </button>
      </div>
      <div id="report-stats" class="stat-grid"></div>
      <div class="report-grid">
        <section class="card chart-card">
          <div class="card-head">
            <div>
              <h2>Tempo de utilização</h2>
              <p>Horas de uso por período</p>
            </div>
          </div>
          <canvas id="usage-chart"></canvas>
        </section>
        <section class="card chart-card">
          <div class="card-head">
            <div>
              <h2>Alertas por nível</h2>
              <p>Distribuição dos eventos</p>
            </div>
          </div>
          <canvas id="alert-chart"></canvas>
        </section>
      </div>
      <div class="card">
        <div class="card-head">
          <div>
            <h2>Filtros</h2>
            <p>
              Os indicadores são calculados apenas com dados cadastrados no
              sistema
            </p>
          </div>
        </div>
        <div class="filters">
          <label>Data inicial<input id="report-start" type="date" /></label
          ><label>Data final<input id="report-end" type="date" /></label
          ><button class="btn btn-secondary" id="apply-report">
            Aplicar filtros
          </button>
        </div>
      </div>
    </template>
    <div id="app"></div>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/relatorios.js"></script>
  </body>
</html>
