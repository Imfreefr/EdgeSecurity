<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários e Permissões — EdgeSecurity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/edge.css" />
    <link rel="stylesheet" href="../css/usuarios.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body data-page="usuarios">
    <template id="page-template">
      <div class="page-head">
        <div>
          <h1>Usuários e Permissões</h1>
          <p>Gerencie contas, cargos, status e acesso às câmeras</p>
        </div>
        <button class="btn btn-primary" id="add-user">+ Criar usuário</button>
      </div>
      <div id="user-stats" class="stat-grid" aria-busy="true" aria-label="Carregando estatísticas">
        <div class="stat" aria-hidden="true"><div class="label">Usuários cadastrados</div><div class="value"><span class="users-skeleton"></span></div><div class="hint">Carregando…</div></div>
        <div class="stat" aria-hidden="true"><div class="label">Contas ativas</div><div class="value"><span class="users-skeleton"></span></div><div class="hint">Carregando…</div></div>
        <div class="stat" aria-hidden="true"><div class="label">Administradores</div><div class="value"><span class="users-skeleton"></span></div><div class="hint">Carregando…</div></div>
        <div class="stat" aria-hidden="true"><div class="label">Sessões atuais</div><div class="value"><span class="users-skeleton"></span></div><div class="hint">Carregando…</div></div>
      </div>
      <div class="card"><div id="users-table" class="table-wrap" aria-busy="true">
        <p role="status" class="empty">Carregando usuários…</p>
        <div class="users-skeleton-row" aria-hidden="true"><span class="users-skeleton"></span><span class="users-skeleton"></span><span class="users-skeleton"></span></div>
        <div class="users-skeleton-row" aria-hidden="true"><span class="users-skeleton"></span><span class="users-skeleton"></span><span class="users-skeleton"></span></div>
      </div></div>
      <div id="user-modal" class="modal hidden"></div>
    </template>
    <div id="app"></div>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/usuarios.js"></script>
  </body>
</html>
