<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câmeras — EdgeSecurity</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/cameras.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body data-page="cameras"><template id="page-template">
<div class="page-head"><div><h1>Câmeras</h1><p>Use uma câmera disponível neste dispositivo, caso exista.</p></div><button class="btn btn-primary" id="detect-cameras">Detectar câmeras</button></div>
<div class="card camera-live-card">
  <div class="card-head"><div><h2>Visualização</h2><p id="camera-device-label">Nenhuma câmera selecionada</p></div><span id="camera-live-status" class="status-pill">Sem transmissão</span></div>
  <div class="camera-stage-real"><video id="camera-video" autoplay muted playsinline></video><div id="camera-empty" class="camera-empty-real"><strong>Nenhuma câmera em uso</strong><span>Conceda permissão ao navegador para acessar uma câmera disponível.</span><button class="btn btn-primary" id="start-camera">Usar câmera</button></div></div>
  <div class="camera-controls"><label>Câmera disponível<select id="camera-select" disabled><option>Nenhuma câmera detectada</option></select></label><button class="btn btn-secondary" id="stop-camera" disabled>Parar câmera</button></div>
</div>
<div class="card"><div class="card-head"><div><h2>Dispositivos disponíveis</h2><p id="camera-help">A lista será preenchida pelo navegador após a permissão de câmera.</p></div></div><div id="device-list" class="empty-state">Nenhuma câmera detectada ainda.</div></div>
</template><div id="app"></div>
<script src="../js/mock-data.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script src="../js/camera-api.js"></script><script src="../js/cameras.js"></script></body></html>
