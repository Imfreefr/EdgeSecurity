<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações — EdgeSecurity</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/configuracoes.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body data-page="configuracoes"><template id="page-template">
<div class="page-head"><div><h1>Configurações</h1><p>Preferências da conta e do sistema</p></div></div>
<div class="settings-grid">
  <section class="card settings-card"><h2>Conta</h2><label>Nome<input id="setting-name"></label><label>E-mail<input id="setting-email"></label><button class="btn btn-primary" id="save-account">Salvar alterações</button></section>
  <section class="card settings-card"><h2>Aparência</h2><label>Tema<select id="theme"><option value="light">Claro</option><option value="dark">Escuro</option></select></label><label>Tamanho da fonte<select id="font-size"><option value="normal">Normal</option><option value="large">Grande</option></select></label><button class="btn btn-secondary" id="save-appearance">Salvar preferências</button></section>
  <section class="card settings-card admin-only"><h2>Sistema</h2><label>Intervalo de atualização (segundos)<input id="refresh-interval" type="number" min="5" value="30"></label><label><span class="switch-line"><input id="notifications" type="checkbox" checked> Notificações de alertas</span></label><button class="btn btn-primary" id="save-system">Salvar configurações</button></section>
</div>
</template><div id="app"></div>
<script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script src="../js/configuracoes.js"></script></body></html>
